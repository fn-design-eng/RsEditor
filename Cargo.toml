[package]
name = "rs_editor"
version = "1.0.1-dev2"
edition = "2021"
description = "Tabbed text editor with character encoding conversion"
license = "MIT"
repository = "https://github.com/fn-design-eng/RsEditor"

[dependencies]
eframe = "0.29.1"
rfd = "0.15"
encoding_rs = "0.8"
chardetng = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
